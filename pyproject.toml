[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-model"
version = "0.1.0"
description = "Diabetic Retinopathy 5-stage classification model, training, and FastAPI inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools]
package-dir = {"" = "src", "api" = "api"}
packages = ["dr", "api"]
